name: slsea-solar-api

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: solar
      POSTGRES_USER: solar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - solar_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solar -d solar"]
      interval: 5s
      timeout: 3s
      retries: 15
    logging:
      options:
        max-size: 10m
        max-file: "3"

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://solar:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/solar
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SEED_CREDENTIAL_MASTER: ${SEED_CREDENTIAL_MASTER:?Set SEED_CREDENTIAL_MASTER in .env}
      PORT: 3000
      NODE_ENV: production
    ports:
      - "127.0.0.1:4400:3000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npm run migrate && npm start"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  solar_pg_data:
