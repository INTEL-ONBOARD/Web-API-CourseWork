openapi: 3.0.3
info:
  title: SLSEA Solar Generation Data API
  version: 0.1.0
  description: Backend API for synthetic solar-generation coursework data. Devices ingest readings for their own
    installations; SLSEA users read only within their jurisdictions. Readings are append-only.
servers:
  - url: /api/v1
tags:
  - name: Authentication
  - name: Geography
  - name: Installations
  - name: Readings
  - name: Operations
paths:
  /auth/user-tokens:
    post:
      tags:
        - Authentication
      summary: Exchange analyst or administrator credentials for a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "401":
          $ref: "#/components/responses/Error"
  /auth/device-tokens:
    post:
      tags:
        - Authentication
      summary: Exchange meter ID and device secret for a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "401":
          $ref: "#/components/responses/Error"
  /provinces:
    get:
      tags:
        - Geography
      summary: List provinces visible to the caller
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Scoped JSON collection
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Province"
        "304":
          description: Not modified; empty body
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "406":
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/ifNoneMatch"
    post:
      tags:
        - Geography
      summary: Create a province (administrator)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvinceInput"
      responses:
        "201":
          description: Resource created
          headers: &a1
            Location:
              schema:
                type: string
              description: Canonical URI of the created resource
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Province"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "406":
          $ref: "#/components/responses/Error"
  /provinces/{provinceId}:
