components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    provinceId:
      name: provinceId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    districtId:
      name: districtId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    substationId:
      name: substationId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    installationId:
      name: installationId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    readingId:
      name: readingId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
    from:
      name: from
      in: query
      schema:
        type: string
        format: date-time
      description: Inclusive start
    to:
      name: to
      in: query
      schema:
        type: string
        format: date-time
      description: Exclusive end
    sort:
      name: sort
      in: query
      schema:
        type: string
        enum:
          - timestamp_asc
          - timestamp_desc
        default: timestamp_desc
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    pageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    ifNoneMatch:
      name: If-None-Match
      in: header
      schema:
        type: string
    ifMatch:
      name: If-Match
      in: header
      schema:
        type: string
      description: Optional strong ETag precondition; mismatch returns 412
  schemas:
    Credentials:
      type: object
      required:
        - identity
        - secret
      properties:
        identity:
          type: string
          description: Username or meter ID
        secret:
          type: string
          format: password
    Token:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
        scope:
          type: string
    ProvinceInput:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          example: WESTERN
        name:
          type: string
          example: Western
    ReadingInput:
      type: object
      required:
        - recorded_at
        - power_kw
        - energy_kwh
        - voltage
      properties:
        recorded_at:
          type: string
          format: date-time
        power_kw:
          type: number
          minimum: 0
        energy_kwh:
          type: number
          minimum: 0
        voltage:
          type: number
          exclusiveMinimum: true
          minimum: 0
    Error:
      type: object
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
        message:
          type: string
        details:
          nullable: true
    History:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/GenerationReading"
        pagination:
          type: object
          properties:
            total:
              type: integer
            page:
              type: integer
            page_size:
              type: integer
            next:
              type: string
              nullable: true
            previous:
              type: string
              nullable: true
    Province:
      type: object
      required:
        - id
        - code
        - name
      additionalProperties: false
      properties:
        id: &a3
          type: integer
        code: &a4
          type: string
        name: &a5
          type: string
        created_at: &a6
          type: string
          format: date-time
        updated_at: &a7
          type: string
          format: date-time
    District:
      type: object
      required:
        - id
        - province_id
        - code
        - name
      additionalProperties: false
      properties:
        id: *a3
        code: *a4
        name: *a5
        created_at: *a6
        updated_at: *a7
        province_id:
          type: integer
    GridSubstation:
      type: object
      required:
        - id
        - district_id
        - code
        - name
      additionalProperties: false
      properties:
        id: *a3
        code: *a4
        name: *a5
        created_at: *a6
        updated_at: *a7
        district_id:
          type: integer
    SolarInstallation:
      type: object
      required:
        - id
        - substation_id
        - meter_id
        - capacity_kw
        - status
      additionalProperties: false
      properties:
        id:
          type: integer
        substation_id:
          type: integer
        meter_id:
          type: string
        capacity_kw:
          type: number
        status:
          type: string
          enum:
            - active
            - inactive
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GenerationReading:
      type: object
      required:
        - id
        - installation_id
        - recorded_at
        - power_kw
        - energy_kwh
        - voltage
      additionalProperties: false
      properties:
        id:
          type: string
        installation_id:
          type: integer
        recorded_at:
          type: string
          format: date-time
        power_kw:
          type: number
        energy_kwh:
          type: number
        voltage:
          type: number
        received_at:
          type: string
          format: date-time
    DistrictCreateInput:
      type: object
      required:
        - code
        - name
      additionalProperties: false
      properties:
        code: &a8
          type: string
        name: &a9
          type: string
    DistrictInput:
      type: object
      required:
        - province_id
        - code
        - name
      additionalProperties: false
      properties:
        code: *a8
        name: *a9
        province_id:
          type: integer
          minimum: 1
    SubstationCreateInput:
      type: object
      required:
        - code
        - name
      additionalProperties: false
      properties:
        code: &a10
          type: string
        name: &a11
          type: string
    SubstationInput:
      type: object
      required:
        - district_id
        - code
        - name
      additionalProperties: false
      properties:
        code: *a10
        name: *a11
        district_id:
          type: integer
          minimum: 1
    InstallationCreateInput:
      type: object
      required:
        - meter_id
        - capacity_kw
        - device_secret
      additionalProperties: false
      properties:
        meter_id: &a12
          type: string
        capacity_kw: &a13
          type: number
          exclusiveMinimum: true
          minimum: 0
        status: &a14
          type: string
          enum:
            - active
            - inactive
        device_secret: &a15
          type: string
          format: password
          minLength: 20
    InstallationInput:
      type: object
      required:
        - substation_id
        - meter_id
        - capacity_kw
        - status
      additionalProperties: false
      properties:
        meter_id: *a12
        capacity_kw: *a13
        status: *a14
        device_secret: *a15
        substation_id:
          type: integer
          minimum: 1
    ProvincePatch:
      type: object
      properties:
        code:
          type: string
          example: WESTERN
        name:
          type: string
          example: Western
      minProperties: 1
    DistrictPatch:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        name:
          type: string
        province_id:
          type: integer
          minimum: 1
      minProperties: 1
    SubstationPatch:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        name:
          type: string
        district_id:
          type: integer
          minimum: 1
      minProperties: 1
    InstallationPatch:
      type: object
      additionalProperties: false
      properties:
        meter_id:
          type: string
        capacity_kw:
          type: number
          exclusiveMinimum: true
          minimum: 0
        status:
          type: string
          enum:
            - active
            - inactive
        device_secret:
          type: string
          format: password
          minLength: 20
        substation_id:
          type: integer
          minimum: 1
      minProperties: 1
    DistrictSummary:
      type: object
      required:
        - district_id
        - day
        - time_zone
        - as_of
        - installation_count
        - fresh_installation_count
        - stale_installation_count
        - current_power_kw
        - today_energy_kwh
      additionalProperties: false
      properties:
        district_id:
          type: integer
        day:
          type: string
          format: date
        time_zone:
          type: string
          example: Asia/Colombo
        as_of:
          type: string
          format: date-time
        latest_recorded_at:
          type: string
          format: date-time
          nullable: true
        installation_count:
          type: integer
        fresh_installation_count:
          type: integer
        stale_installation_count:
          type: integer
        current_power_kw:
          type: number
        today_energy_kwh:
          type: number
  requestBodies:
    Province:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProvinceInput"
  responses:
    Error:
      description: Structured API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Item:
      description: JSON resource
      headers:
        ETag:
          schema:
            type: string
        Last-Modified:
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
    DynamicItem:
      description: Time-sensitive JSON resource
      headers:
        ETag:
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
    Collection:
      description: Scoped JSON collection
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
    History:
      description: Scoped paginated readings
      headers:
        ETag:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/History"
    Created:
      description: Resource created
      headers: *a1
      content:
        application/json:
          schema:
            type: object
