  /provinces/{provinceId}/generation-readings:
    parameters:
      - $ref: "#/components/parameters/provinceId"
    get:
      tags:
        - Readings
      summary: Paginated province history
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/History"
        "304":
          description: Not modified; empty body
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "406":
          $ref: "#/components/responses/Error"
      parameters: &a2
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/ifNoneMatch"
  /districts/{districtId}/generation-readings:
    parameters:
      - $ref: "#/components/parameters/districtId"
    get:
      tags:
        - Readings
      summary: Paginated district history
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/History"
        "304":
          description: Not modified; empty body
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "406":
          $ref: "#/components/responses/Error"
